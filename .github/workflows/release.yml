name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: ./scripts/build.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent "Idea Box.app" "IdeaBox-${GITHUB_REF_NAME}.zip"
          ls -lh "IdeaBox-${GITHUB_REF_NAME}.zip"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/IdeaBox-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
