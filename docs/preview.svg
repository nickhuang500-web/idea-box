<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-label="Idea Box: a frosted pill and the editor it opens">
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="pillShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F2F4"/>
      <stop offset="1" stop-color="#E4E4E8"/>
    </linearGradient>
  </defs>

  <rect width="760" height="440" fill="#F6F7F9"/>

  <rect x="40" y="40" width="420" height="230" rx="14" fill="#FFFFFF" stroke="#E1E2E6" filter="url(#cardShadow)"/>
  <rect x="56" y="56" width="388" height="150" rx="10" fill="#FFFFFF" stroke="#E4E5E9"/>
  <text x="74" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" fill="#B6B9C0">记下此刻的想法…</text>

  <text x="58" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11.5" fill="#6B7280">今天 1 条</text>
  <text x="444" y="228" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11.5" fill="#A0A4AB">⏎ 保存 · ⇧⏎ 换行 · esc 收起</text>

  <rect x="40" y="300" width="112" height="38" rx="19" fill="url(#frost)" stroke="#D8D9DD" filter="url(#pillShadow)"/>
  <text x="96" y="324" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#1F2328">＋ 想法</text>

  <text x="40" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8A8F98">Click the pill, type, Enter — the idea lands in ~/Desktop/Ideas.md</text>
</svg>
